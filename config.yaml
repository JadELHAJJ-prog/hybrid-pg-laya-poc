# Single source of truth for model tags, thresholds and paths. Snapshotted into every run dir.
today: "2026-09-20"          # fixed "today" so refund policy windows are deterministic
seed: 1234

paths:
  graph: graphs/refunddesk_v1.yaml
  orders: data/orders.json
  kb: data/kb.json
  service_status: data/service_status.json
  tickets: data/tickets.jsonl
  runs: runs

llm:
  host: http://localhost:11434
  model: qwen3.5-9b-text   # local build of hf.co/unsloth/Qwen3.5-9B-GGUF:Q4_K_M without mmproj; see ollama/Modelfile.qwen3.5-9b-text
  num_ctx: 8192
  temperature: 0.0
  think_routing: false
  think_nodes: false
  keep_alive: 30m
  max_tool_rounds: 4

laya:
  repo: convaiinnovations/laya
  subfolder: ""   # chosen on dev in Phase 5
  device: cuda                 # cuda | cpu (fallback a)
  bf16_weights: true           # store weights in bf16 on CUDA (see laya_router.load_agent)
  guard_mode: choice   # choice | preset, chosen on dev (Phase 5)
  post_temperatures: {3: 0.575, 4: 0.742, 5: 0.783}   # per option count, fitted on dev (Phase 5)
  finetuned: models/laya_refunddesk   # Phase 7: unzip the Kaggle output here (gitignored)

routing:
  tau: 0.87   # chosen on dev in Phase 5 (reports/calibration_dev.json)
  gate: answer_confidence
  max_steps: 20

finetuned_calibration:   # dev-only calibration for this checkpoint (Phase 7)
  tau: 0.83
  gate: answer_confidence
  guard_mode: choice
  post_temperatures: {3: 0.666, 4: 0.043, 5: 0.748}

finetuned_calibration:   # dev-only calibration for this checkpoint (Phase 7)
  tau: 0.83
  gate: answer_confidence
  guard_mode: choice
  post_temperatures: {3: 0.666, 4: 0.500, 5: 0.748}
